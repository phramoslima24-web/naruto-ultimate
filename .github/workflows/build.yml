
name: Build Narutoto Ultimate RPG

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Detect project directory
        id: project
        run: |
          if [ -f build.gradle ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f narutoto-ultimate/build.gradle ]; then
            echo "dir=narutoto-ultimate" >> "$GITHUB_OUTPUT"
          else
            echo "Erro: build.gradle não encontrado"
            exit 1
          fi

      - name: Build mod
        run: |
          gradle -p "${{ steps.project.outputs.dir }}" --no-daemon clean build

      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: narutoto-ultimate-0.5.0
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-sources.jar
          if-no-files-found: error
